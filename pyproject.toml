[project]
name = "mdsearch-cli"
version = "0.2.0"
description = "Semantic search over a markdown (Obsidian) vault, as a CLI and an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nakshh Kohli", email = "nakshhkohli04@gmail.com" }]
keywords = ["semantic-search", "obsidian", "markdown", "faiss", "embeddings", "vector-search", "mcp", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "faiss-cpu>=1.14",
    "sentence-transformers>=5.5",
    "torch>=2.12",
    "transformers>=5.9",
    "numpy>=2.4",
    "typer>=0.25",
    "rich>=15.0",
    "mcp",
]

[project.urls]
Repository = "https://github.com/Nakshh/mdsearch"
Issues = "https://github.com/Nakshh/mdsearch/issues"

[project.scripts]
mdsearch = "mdsearch.cli:app"
mdsearch-mcp = "mdsearch.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mdsearch*"]
